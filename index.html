<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050a12">
<meta name="description" content="长夜档案馆 · 第七号机柜：单文件轻科幻解谜，约 70–82 分钟，离线可玩。">
<title>长夜档案馆 · 第七号机柜</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%237ff0c1' stroke-width='2' opacity='.55'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%237ff0c1'/%3E%3C/svg%3E">
<style>
:root{
  --void:#03060b; --deep:#050a12; --panel:#0a131d; --panel2:#0d1a26;
  --hair:rgba(150,222,208,.14); --hair2:rgba(108,192,255,.16);
  --ph:#7ff0c1; --ph-dim:#4d8f7b; --cy:#6cc0ff; --am:#ffcb6b; --rd:#ff7f6e;
  --tx:#dcebef; --tx2:#8fa7b4; --tx3:#5b7382;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Mono","Courier New",monospace;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --serif:"Songti SC","Source Han Serif SC","Noto Serif SC","SimSun",serif;
  --r:2px;
  --sh:0 18px 50px -24px rgba(0,0,0,.9);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--void); color:var(--tx); font-family:var(--sans);
  line-height:1.8; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  letter-spacing:.2px;
}
::selection{background:rgba(127,240,193,.22);color:#eafff8}

/* 背景层 */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(1100px 620px at 78% -12%, rgba(108,192,255,.13), transparent 62%),
    radial-gradient(900px 540px at 4% 108%, rgba(127,240,193,.07), transparent 60%),
    radial-gradient(700px 400px at 50% 50%, rgba(70,110,140,.05), transparent 70%),
    linear-gradient(180deg,#03060b,#061019 46%,#04080f);
}
.bg .aur{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:drift 26s ease-in-out infinite}
.bg .a1{width:520px;height:520px;left:-120px;top:-160px;background:rgba(108,192,255,.16)}
.bg .a2{width:460px;height:460px;right:-140px;bottom:-180px;background:rgba(127,240,193,.10);animation-delay:-9s}
@keyframes drift{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(26px,18px,0)}}
.bg:after{content:"";position:absolute;inset:0;opacity:.4;
  background-image:linear-gradient(rgba(127,240,193,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(127,240,193,.045) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse at 50% 26%,#000 26%,transparent 76%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 26%,#000 26%,transparent 76%);}
.scan{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.22;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.038) 0 1px,transparent 1px 4px)}
.grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.22;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");
}

/* 外壳 */
.frame{position:relative;z-index:3;max-width:1240px;margin:0 auto;padding:12px clamp(10px,2vw,24px) 56px;
  display:grid;grid-template-columns:236px minmax(0,1fr);gap:16px;align-items:start}
.frame.covermode{grid-template-columns:minmax(0,1fr);max-width:1080px}
.frame.covermode .rail{display:none}

.topbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:9px 14px;border:1px solid var(--hair);
  background:linear-gradient(180deg,rgba(17,30,42,.86),rgba(7,14,21,.8));
  border-radius:var(--r);position:sticky;top:8px;z-index:40;
  backdrop-filter:blur(12px) saturate(120%);box-shadow:0 10px 30px -18px #000}
.topbar:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ph);
  box-shadow:0 0 12px 2px rgba(127,240,193,.6);animation:blip 2.6s infinite;flex:none}
@keyframes blip{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:1;transform:scale(1)}}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:2.4px;color:var(--ph);text-transform:uppercase;line-height:1.5}
.brand small{display:block;font-size:9.5px;letter-spacing:1.4px;color:var(--tx3);text-transform:none;margin-top:2px}
.spacer{flex:1}
.progwrap{display:flex;align-items:center;gap:9px}
.prog{display:flex;gap:3px;align-items:center}
.prog i{display:block;width:14px;height:3px;background:rgba(255,255,255,.13);border-radius:1px;transition:.35s}
.prog i.on{background:var(--ph);box-shadow:0 0 8px rgba(127,240,193,.55)}
.prog i.hid{background:var(--am);box-shadow:0 0 8px rgba(255,203,107,.5)}
.progwrap .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:1.6px;color:var(--tx3)}
.node-id{font-family:var(--mono);font-size:10.5px;color:var(--cy);letter-spacing:1.6px;white-space:nowrap}
.tbtn{font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;color:var(--tx2);background:rgba(12,22,32,.7);
  border:1px solid var(--hair);padding:7px 12px;border-radius:var(--r);cursor:pointer;transition:.18s}
.tbtn:hover{color:var(--ph);border-color:rgba(127,240,193,.45);background:rgba(127,240,193,.07);transform:translateY(-1px)}
.tbtn:active{transform:translateY(0)}
.tbtn.on{color:var(--ph);border-color:rgba(127,240,193,.55);background:rgba(127,240,193,.1)}
.tbtn.off{color:var(--tx3)}

/* 左栏档案柜 */
.rail{border:1px solid var(--hair);background:linear-gradient(180deg,rgba(11,20,30,.8),rgba(6,11,17,.72));
  border-radius:var(--r);padding:12px 0 10px;position:sticky;top:64px;box-shadow:var(--sh)}
.rail-h{font-family:var(--mono);font-size:9.5px;letter-spacing:2.8px;color:var(--tx3);padding:0 14px 10px;
  border-bottom:1px solid var(--hair);margin-bottom:8px;display:flex;justify-content:space-between}
.rail-h span{color:var(--ph-dim)}
.rec{display:flex;gap:11px;align-items:flex-start;padding:10px 14px;cursor:pointer;transition:.18s;
  border-left:2px solid transparent;position:relative}
.rec:hover{background:rgba(127,240,193,.045);transform:translateX(2px)}
.rec.cur{background:linear-gradient(90deg,rgba(127,240,193,.1),transparent);border-left-color:var(--ph)}
.rec.lk{opacity:.4;cursor:not-allowed}
.rec.lk:hover{transform:none;background:none}
.rec .no{font-family:var(--mono);font-size:9.5px;color:var(--tx3);padding-top:2px;min-width:22px;letter-spacing:1px}
.rec .nm{font-size:13px;color:var(--tx);line-height:1.4;transition:.18s}
.rec .st{font-family:var(--mono);font-size:8.5px;letter-spacing:1.4px;color:var(--tx3);margin-top:2px}
.rec.dn .st{color:var(--ph)}
.rec.dn .nm{color:#bff6e1}
.rec.dn::after{content:"";position:absolute;right:12px;top:14px;width:4px;height:4px;border-radius:50%;
  background:var(--ph);box-shadow:0 0 8px rgba(127,240,193,.7)}
.rec.hid{border-left-color:var(--am)}
.rec.hid .st{color:var(--am)}
.rec.hid.dn::after{background:var(--am);box-shadow:0 0 8px rgba(255,203,107,.7)}
.rail-foot{margin-top:10px;padding:10px 14px 0;border-top:1px solid var(--hair);
  font-family:var(--mono);font-size:8.5px;color:var(--tx3);letter-spacing:1.2px;line-height:1.9}
.rail-foot .lampline{margin-top:6px;display:flex;gap:4px}
.rail-foot .lampline i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.1);transition:.4s}
.rail-foot .lampline i.on{background:var(--am);box-shadow:0 0 7px rgba(255,203,107,.75)}

/* 主舞台 */
.stage{min-height:560px;animation:fadein .45s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.panel{border:1px solid var(--hair);background:linear-gradient(180deg,rgba(13,23,33,.94),rgba(7,12,19,.9));
  border-radius:var(--r);padding:0;overflow:hidden;position:relative;box-shadow:var(--sh)}
.panel:before,.panel:after{content:"";position:absolute;width:18px;height:18px;border:1px solid rgba(127,240,193,.4);pointer-events:none}
.panel:before{top:6px;left:6px;border-right:0;border-bottom:0}
.panel:after{bottom:6px;right:6px;border-left:0;border-top:0}
.ph-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:18px 20px 14px;border-bottom:1px solid var(--hair);
  background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
.ph-kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:3px;color:var(--cy);text-transform:uppercase}
.ph-title{font-size:22px;color:#eaf6f8;letter-spacing:2px;margin-top:5px;font-weight:600}
.ph-sub{font-size:11.5px;color:var(--tx3);margin-top:3px;letter-spacing:.4px}
.hero{background:#050a11;border-bottom:1px solid var(--hair);position:relative;overflow:hidden}
.hero svg{display:block;width:100%;height:auto;position:relative;z-index:1}
.hero .hero-veil{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,transparent 58%,rgba(6,12,18,.75));}
.hero .hero-cap{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:8px 16px;display:flex;justify-content:space-between;
  font-family:var(--mono);font-size:9px;letter-spacing:1.8px;color:rgba(160,200,210,.55);pointer-events:none}
.body{padding:18px 20px 22px}
.lede{font-size:14px;color:#d9e9ef;margin:0 0 16px;max-width:76ch;line-height:1.9}
.lede em{color:var(--am);font-style:normal}
.lede b{color:var(--ph);font-weight:600}
.lede .dim{color:var(--tx3);font-size:12.5px}

/* 控件 */
.sub{font-family:var(--mono);font-size:9.5px;letter-spacing:2px;color:var(--tx3);
  margin:18px 0 9px;display:flex;align-items:center;gap:10px;text-transform:uppercase}
.sub:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--hair),transparent)}
.btn{font-family:var(--mono);font-size:11.5px;letter-spacing:1.4px;padding:10px 18px;border-radius:var(--r);cursor:pointer;
  border:1px solid var(--hair2);background:linear-gradient(180deg,rgba(108,192,255,.14),rgba(108,192,255,.05));color:#c6e6ff;
  transition:.18s;position:relative}
.btn:hover{background:linear-gradient(180deg,rgba(108,192,255,.24),rgba(108,192,255,.08));border-color:var(--cy);
  box-shadow:0 0 0 1px rgba(108,192,255,.15),0 8px 20px -12px rgba(108,192,255,.6);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.99)}
.btn.go{border-color:rgba(127,240,193,.5);background:linear-gradient(180deg,rgba(127,240,193,.18),rgba(127,240,193,.05));color:#c8ffe9}
.btn.go:hover{background:linear-gradient(180deg,rgba(127,240,193,.3),rgba(127,240,193,.1));border-color:var(--ph);
  box-shadow:0 0 0 1px rgba(127,240,193,.2),0 10px 26px -14px rgba(127,240,193,.7)}
.btn:disabled{opacity:.32;cursor:not-allowed;filter:grayscale(.4)}
.btn.sm{padding:6px 12px;font-size:10.5px;letter-spacing:1px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=text],input[type=number]{font-family:var(--mono);background:rgba(3,8,13,.9);border:1px solid var(--hair);
  color:var(--ph);padding:10px 13px;border-radius:var(--r);font-size:15px;letter-spacing:3px;outline:none;transition:.18s}
input[type=text]:focus,input[type=number]:focus{border-color:var(--ph);background:rgba(6,18,20,.9);
  box-shadow:0 0 0 1px rgba(127,240,193,.18),0 0 24px -10px rgba(127,240,193,.6)}
input.bad{border-color:var(--rd);animation:sh .32s}
@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.note{display:block;font-size:11.5px;color:var(--tx3);line-height:1.7}
.msg{font-size:11.5px;min-height:18px;margin-top:10px;font-family:var(--mono);letter-spacing:.6px;transition:.2s}
.msg.e{color:var(--rd)}.msg.s{color:var(--ph)}
.linkish{color:var(--cy);cursor:pointer;border-bottom:1px dotted var(--cy)}
.mono{font-family:var(--mono)}

/* 成功条 */
.done-strip{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;margin-top:18px;
  border:1px solid rgba(127,240,193,.3);border-radius:var(--r);
  background:linear-gradient(120deg,rgba(127,240,193,.1),rgba(127,240,193,.02) 60%);
  animation:pop .5s cubic-bezier(.2,.9,.2,1) both;position:relative;overflow:hidden}
.done-strip:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(127,240,193,.18),transparent);
  transform:translateX(-100%);animation:sweep 1.1s .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes sweep{to{transform:translateX(100%)}}
.done-strip .k{font-family:var(--mono);font-size:9.5px;color:var(--ph);letter-spacing:2.2px}
.done-strip .v{font-size:13px;color:#d9fbef;line-height:1.7}
.navfoot{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}

/* 抽屉 */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,94vw);z-index:60;
  background:linear-gradient(180deg,#08121b,#050b12);border-left:1px solid var(--hair);
  transform:translateX(102%);transition:.3s cubic-bezier(.4,0,.2,1);padding:20px 18px;overflow-y:auto;
  box-shadow:-30px 0 60px -30px #000}
.drawer.open{transform:none}
.drawer h3{font-family:var(--mono);font-size:10px;letter-spacing:2.6px;color:var(--ph);margin-bottom:12px}
.kitem{border:1px solid var(--hair);border-radius:var(--r);padding:10px 12px;margin:9px 0;
  background:linear-gradient(180deg,rgba(16,28,38,.7),rgba(9,16,23,.5));transition:.2s}
.kitem:hover{border-color:rgba(127,240,193,.4)}
.kitem .kk{font-family:var(--mono);font-size:9.5px;letter-spacing:1.6px;color:var(--tx3)}
.kitem .kv{font-size:15px;color:var(--am);letter-spacing:2px}
.kitem .kn{font-size:11.5px;color:var(--tx2);margin-top:3px;line-height:1.6}
.litem{font-size:12px;color:var(--tx2);padding:8px 0;border-bottom:1px dotted rgba(127,240,193,.1);line-height:1.75}
.litem b{color:var(--cy);font-weight:600}
.mask{position:fixed;inset:0;background:rgba(2,5,9,.66);z-index:55;display:none;backdrop-filter:blur(3px)}
.mask.open{display:block}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);z-index:70;
  background:linear-gradient(180deg,#0e1c26,#08131c);border:1px solid rgba(127,240,193,.5);color:#bdf6e2;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.8px;padding:10px 18px;border-radius:var(--r);
  opacity:0;pointer-events:none;transition:.24s;box-shadow:0 12px 30px -14px #000}
#toast.show{opacity:1;transform:translateX(-50%)}

/* 归档仪式 */
#archFx{position:fixed;inset:0;z-index:65;pointer-events:none;opacity:0}
#archFx.on{animation:archfade 1.5s ease both}
#archFx .scrim{position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 46%,rgba(2,6,10,.82),rgba(2,6,10,.45) 60%,transparent 100%)}
@keyframes archfade{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
#archFx .bar{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--ph),transparent);
  box-shadow:0 0 24px 6px rgba(127,240,193,.45);top:0;animation:scanline 1.2s cubic-bezier(.4,0,.2,1) both}
@keyframes scanline{from{transform:translateY(0)}to{transform:translateY(100vh)}}
#archFx .tt{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-family:var(--mono);
  font-size:12px;letter-spacing:6px;color:#d7ffee;text-shadow:0 0 20px rgba(127,240,193,.8)}
#archFx.on .tt{animation:ttin 1.6s ease both}
@keyframes ttin{0%{opacity:0;letter-spacing:14px}22%{opacity:1;letter-spacing:7px}78%{opacity:1}100%{opacity:0;letter-spacing:5px}}

/* 封面 */
.cover{text-align:center;padding:4px 0 0}
.cover-art{border:1px solid var(--hair);border-radius:var(--r);overflow:hidden;background:#03060b;position:relative}
.cover-t{font-family:var(--mono);font-size:10px;letter-spacing:6px;color:var(--cy);margin:22px 0 10px }
.cover-h{font-family:var(--serif);font-size:clamp(30px,5vw,46px);letter-spacing:10px;color:#eff9fb;font-weight:600;
  text-shadow:0 0 40px rgba(127,240,193,.18)}
.cover-s{font-family:var(--mono);font-size:10.5px;letter-spacing:3px;color:var(--tx3);margin-top:10px}
.cover-rule{width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--ph),transparent);margin:18px auto 0}
.cover-p{max-width:60ch;margin:20px auto 0;font-size:14px;color:#cbdde5;text-align:left;line-height:2}
.boot{margin:20px auto 0;max-width:600px;text-align:left;font-family:var(--mono);font-size:10.5px;
  color:var(--ph-dim);line-height:2;letter-spacing:.6px}
.boot div{opacity:0;animation:fadein .7s ease forwards}
.boot div .ok{color:var(--ph)}

/* 物件台 */
.desk{border:1px solid var(--hair);background:radial-gradient(ellipse at 50% 0%,rgba(108,192,255,.07),transparent 70%),#060c13;
  border-radius:var(--r);padding:12px;position:relative;overflow:hidden}
.desk .tl{position:absolute;left:10px;top:7px;font-family:var(--mono);font-size:8.5px;letter-spacing:1.8px;color:var(--tx3)}
.desk .tr{position:absolute;right:10px;top:7px;font-family:var(--mono);font-size:8.5px;letter-spacing:1.8px;color:var(--tx3)}
.chip{display:inline-flex;align-items:center;gap:9px;font-size:12.8px;color:#cde6ee;line-height:1.55;
  background:linear-gradient(180deg,rgba(16,32,44,.9),rgba(9,18,26,.9));border:1px solid var(--hair2);border-radius:var(--r);
  padding:9px 12px;cursor:pointer;transition:.16s;max-width:100%;position:relative}
.chip:hover{border-color:var(--cy);background:linear-gradient(180deg,rgba(108,192,255,.16),rgba(108,192,255,.05));
  transform:translateY(-1px);box-shadow:0 8px 22px -16px rgba(108,192,255,.8)}
.chip .num{font-family:var(--mono);font-size:9px;color:var(--tx3)}
.chip.used{opacity:.22;pointer-events:none}
.chip .play{width:20px;height:20px;border-radius:50%;border:1px solid var(--hair2);display:grid;place-items:center;
  font-size:9px;color:var(--cy);background:rgba(108,192,255,.08);flex:none}
.chip .play:hover{background:rgba(108,192,255,.22)}
.slot{min-height:48px;border:1px dashed rgba(127,240,193,.24);border-radius:var(--r);padding:8px 11px;cursor:pointer;
  display:flex;align-items:center;gap:2px;font-size:12.8px;color:var(--tx3);transition:.16s;background:rgba(5,12,18,.6)}
.slot:hover{border-color:rgba(127,240,193,.4)}
.slot.on{border-style:solid;border-color:var(--hair2);color:#cde6ee;
  background:linear-gradient(90deg,rgba(108,192,255,.1),rgba(10,20,28,.9))}
.slot.cur{border-color:var(--ph);box-shadow:inset 0 0 0 1px rgba(127,240,193,.16),0 0 20px -12px rgba(127,240,193,.7)}
.slot .mk{font-family:var(--mono);font-size:9.5px;color:var(--ph-dim);margin-right:9px;flex:none}

/* 照片 */
.photostage{position:relative;border:1px solid #223746;background:#04070b;overflow:hidden;cursor:none;border-radius:var(--r)}
.photostage svg{display:block;width:100%;height:auto}
.photoctrl{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.slider{display:block}
.slider .lb{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--tx2);letter-spacing:1.2px;margin-bottom:4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;
  background:linear-gradient(90deg,rgba(127,240,193,.5),rgba(108,192,255,.5),rgba(255,255,255,.08))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-6px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#9ff8d4,#0b1a22 70%);border:1px solid var(--ph);
  box-shadow:0 0 10px rgba(127,240,193,.55);transition:.15s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
input[type=range]::-moz-range-track{height:3px;background:var(--ph-dim)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#0b1a22;border:1px solid var(--ph)}

/* 元数据表 */
.meta{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px}
.meta td{border-bottom:1px dotted rgba(127,240,193,.12);padding:8px 6px;vertical-align:top}
.meta td.k{color:var(--tx3);width:32%;letter-spacing:.8px}
.meta td.v{color:#cbe4eb}
.meta td.v.bad{color:var(--am)}
.meta td.v.lock{color:var(--rd);letter-spacing:2px}

/* 十六进制 */
.hexbox{font-family:var(--mono);font-size:9.5px;line-height:1.62;color:#6fa9a0;background:#04090d;
  border:1px solid #16323f;overflow:auto;padding:12px 14px;white-space:pre;border-radius:var(--r);height:340px;letter-spacing:.5px}
.hexbox::-webkit-scrollbar{width:9px;height:9px}
.hexbox::-webkit-scrollbar-track{background:#04090d}
.hexbox::-webkit-scrollbar-thumb{background:#25505c;border-radius:5px}
.hexbox::-webkit-scrollbar-thumb:hover{background:#33707f}
.tailview{margin:14px 0 6px;border-top:1px dashed #2c505c;padding-top:10px;font-family:var(--mono);
  font-size:11px;color:#8fc7b8;white-space:normal}
.tailview .tvh{color:var(--am);letter-spacing:1.6px;font-size:9.5px;margin-bottom:8px}
.tailview .tvl{line-height:2}
.tailview .tvl.hl{color:#ffe3ac;background:rgba(255,203,107,.09);display:inline-block;padding:1px 6px}
.hexbox span[data-off]{cursor:crosshair;transition:background .12s}
.hexbox span[data-off]:hover{background:rgba(127,240,193,.1)}
.hexbox span.sel{background:rgba(255,203,107,.2);color:#ffe3ac;box-shadow:inset 2px 0 0 var(--am)}
.hexbox .hot{color:var(--am)}
.hexbox .dim{color:#33505b}
.hexbox .tail{color:#d8f7ea;background:rgba(255,203,107,.09)}

/* 频谱 */
.specbox{position:relative;background:#03060a;border:1px solid #16323f;border-radius:var(--r);overflow:hidden}
.specbox canvas{display:block;width:100%;height:auto;cursor:crosshair}

/* 星图 */
.starbox{position:relative;background:#03060b;border:1px solid #16323f;overflow:hidden;touch-action:none;
  cursor:grab;border-radius:var(--r)}
.starbox svg{display:block;width:100%;height:auto}
.starbox:active{cursor:grabbing}

/* 配线 */
.patchbox{border:1px solid #16323f;background:#050b11;padding:6px;border-radius:var(--r)}
.lever{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 12px;border:1px solid var(--hair);
  border-radius:var(--r);background:linear-gradient(180deg,rgba(16,30,40,.8),rgba(8,15,22,.8));cursor:pointer;transition:.18s;min-width:92px}
.lever:hover{border-color:var(--cy);transform:translateY(-1px)}
.lever .gl{font-family:var(--mono);font-size:9px;letter-spacing:1.6px;color:var(--tx3)}
.lever .track{width:26px;height:34px;border-radius:3px;background:#071219;border:1px solid #1d4250;position:relative}
.lever .knob{position:absolute;left:2px;right:2px;height:14px;border-radius:2px;
  background:linear-gradient(180deg,#3a7c8e,#12303c);transition:.26s cubic-bezier(.2,.9,.2,1)}
.lever .knob.up{bottom:2px}
.lever .knob.dn{top:2px}
.lever .st{font-family:var(--mono);font-size:9px;letter-spacing:1px}
.lever .st.on{color:var(--am)}
.lever .st.off{color:var(--ph)}

/* 终端 */
.term{font-family:var(--mono);font-size:11.5px;color:#8fd8c4;background:#040a0e;border:1px solid #16323f;
  padding:16px;line-height:2;border-radius:var(--r);position:relative;overflow:hidden}
.term:before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px)}
.term .k{color:var(--tx3)}
.badge{font-family:var(--mono);font-size:9.5px;letter-spacing:1.8px;padding:4px 10px;border:1px solid;border-radius:var(--r)}
.badge.ok{color:var(--ph);border-color:rgba(127,240,193,.5);background:rgba(127,240,193,.08)}
.badge.warn{color:var(--am);border-color:rgba(255,203,107,.5);background:rgba(255,203,107,.07)}
.badge.no{color:var(--rd);border-color:rgba(255,127,110,.5);background:rgba(255,127,110,.06)}

/* 灯（可发现的隐藏点亮物） */
.lamp{position:absolute;z-index:4;width:18px;height:18px;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle,rgba(255,203,107,.22),transparent 68%);
  border:1px solid rgba(255,203,107,.28);display:grid;place-items:center;transition:.25s}
.lamp:after{content:"";width:4px;height:4px;border-radius:50%;background:rgba(255,203,107,.5);
  box-shadow:0 0 8px rgba(255,203,107,.6);animation:blip 3.2s infinite}
.lamp:hover{border-color:rgba(255,203,107,.7);background:radial-gradient(circle,rgba(255,203,107,.4),transparent 70%)}
.lamp.on{border-color:transparent;background:radial-gradient(circle,rgba(255,214,140,.95) 0 22%,rgba(255,203,107,.4) 40%,transparent 72%);
  box-shadow:0 0 26px 8px rgba(255,203,107,.25)}
.lamp.on:after{width:5px;height:5px;background:#fff4d8;box-shadow:0 0 12px #ffcb6b}

/* 结局 */
.credits{border-top:1px solid var(--hair);margin-top:22px;padding-top:16px;text-align:center}
.credits .l1{font-family:var(--serif);font-size:17px;letter-spacing:6px;color:#eaf8f6}
.credits .l2{font-family:var(--mono);font-size:9.5px;letter-spacing:2.6px;color:var(--tx3);margin-top:8px;line-height:2}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:16px}
.stat{border:1px solid var(--hair);border-radius:var(--r);padding:10px 12px 12px;background:rgba(10,20,28,.6);
  text-align:center;position:relative;overflow:hidden}
.stat .n{display:block;font-family:var(--mono);font-size:19px;color:var(--ph);letter-spacing:1px}
.stat .l{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:1.6px;color:var(--tx3);margin-top:4px}
.stat .bar{position:absolute;left:0;bottom:0;height:2px;background:rgba(127,240,193,.55);display:block}
.stat .bar.am{background:rgba(255,203,107,.6)}
.stat .bar.cy{background:rgba(89,184,255,.6)}

/* 工具条 */
.toolbar{display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
.toolbar input{background:rgba(4,10,14,.9);border:1px solid var(--line);color:var(--tx);font-family:var(--mono);
  font-size:11.5px;padding:7px 10px;border-radius:var(--r);letter-spacing:1px;outline:none}
.toolbar input:focus{border-color:var(--ph);box-shadow:0 0 0 2px rgba(127,240,193,.12)}
.btn.sm.on{border-color:rgba(127,240,193,.6);color:var(--ph);background:rgba(127,240,193,.10)}
.dim{color:var(--tx3);font-family:var(--mono);font-size:9.5px;letter-spacing:1.6px}

@media(max-width:900px){
  .frame{grid-template-columns:minmax(0,1fr);gap:10px}
  .rail{position:static;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:8px;align-items:stretch}
  .rail-h,.rail-foot{display:none}
  .rec{flex-direction:column;gap:2px;padding:8px 9px;border:1px solid var(--hair);border-left:1px solid var(--hair);min-width:0}
  .rec.cur{border-color:var(--ph);border-left-color:var(--ph)}
  .rec .no{min-width:0}
  .rec .nm{font-size:12px;line-height:1.3}
  .rec .st{font-size:8px}
  .rec.dn::after{display:none}
  .progwrap{display:flex;order:6;width:100%;justify-content:space-between;gap:6px;padding-top:2px;border-top:1px solid var(--hair);margin-top:2px}
  .prog i{width:11px}
  .statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ================= v3.1 增补 ================= */
@media(max-width:430px){
  .rail{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
  .sigbars{display:none}
  .ph-title{font-size:23px}
}
:root{--hair2:rgba(127,240,193,.16)}
.panel{border-radius:16px;position:relative;isolation:isolate}
.panel::before,.panel::after{content:"";position:absolute;width:15px;height:15px;pointer-events:none;z-index:2;
  border:1px solid var(--hair2);opacity:.9}
.panel::before{left:9px;top:9px;border-right:0;border-bottom:0;border-top-left-radius:3px}

.ph-kicker{position:relative;padding-left:12px}

.hero{box-shadow:inset 0 0 60px rgba(0,0,0,.55),0 18px 40px -28px rgba(0,0,0,.9)}
.btn,.tbtn,.rec,.chip,.lever,.cell{transition:transform .18s cubic-bezier(.2,.6,.2,1),box-shadow .2s,border-color .2s,background .2s}
.btn:active,.tbtn:active{transform:translateY(1px) scale(.995)}

input::placeholder{color:#3f5a68}

@keyframes sig{0%,100%{height:3px;opacity:.25}50%{height:11px;opacity:.85}}
/* 06-B 冷却回路 */
.pipebox{border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,#040a10,#02060a);padding:8px;position:relative}
.pipebox svg{display:block;width:100%;height:auto}
.cell{cursor:pointer}
.cell:hover{background:rgba(127,240,193,.045)}

@keyframes flowdash{to{stroke-dashoffset:-10}}
.gauge{display:flex;gap:10px;align-items:baseline;font-family:var(--mono);font-size:11px;letter-spacing:1.2px;margin-top:9px;flex-wrap:wrap}
.gauge .val{font-size:13px}
.gauge.ok .val{color:var(--ph);text-shadow:0 0 14px rgba(127,240,193,.5)}

.sumline{margin-top:10px;padding:10px 12px;border:1px solid rgba(255,203,107,.35);border-radius:10px;
  background:rgba(255,203,107,.05);font-family:var(--mono);font-size:12px;letter-spacing:2px;color:#ffe2a8}
.rec.sub{border-left-color:rgba(255,203,107,.35)}
.rec.sub .no{color:#e8c07a}
.rec.sub.cur{border-left-color:var(--am)}

/* ================= v3.2 App 质感 ================= */
:root{--line:#1d4250}
html{scroll-behavior:smooth}
body{overscroll-behavior-y:contain}
*{ -webkit-tap-highlight-color:transparent }

.panel{border-radius:18px;background:linear-gradient(180deg,rgba(15,27,38,.92),rgba(8,14,21,.94));
  backdrop-filter:blur(10px);box-shadow:0 26px 60px -32px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.05);
  animation:panelIn .42s cubic-bezier(.2,.8,.2,1) both}

.ph-head{padding:20px 22px 15px}

.body{padding:20px 22px 24px}

.desk,.hexbox,.specbox,.starbox,.patchbox,.pipebox,.term,.photostage{border-radius:14px}

  width:26px;height:26px;cursor:pointer}
.bellmodal .note{font-size:12px;color:var(--tx2);line-height:1.7;margin-bottom:12px}
.bell-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.bellkey{height:64px;border-radius:14px;border:1px solid var(--hair2);cursor:pointer;font-family:var(--mono);
  font-size:11px;letter-spacing:1px;color:#cde6ee;background:linear-gradient(180deg,rgba(16,32,44,.9),rgba(9,18,26,.9));
  transition:.15s}
.bellkey:hover{transform:translateY(-2px);border-color:var(--cy)}
.bellkey.lit{background:rgba(127,240,193,.22);border-color:var(--ph);box-shadow:0 0 18px rgba(127,240,193,.35)}
.bell-status{font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;color:var(--tx3);min-height:18px}
.bell-status.ok{color:var(--ph)}
.bell-status.bad{color:var(--rd)}
.egg-row{border:1px solid rgba(255,203,107,.22);border-radius:12px;padding:9px 12px;margin:8px 0;
  background:rgba(255,203,107,.05)}
.egg-row .ek{font-family:var(--mono);font-size:9.5px;letter-spacing:1.6px;color:var(--am)}
.egg-row .en{font-size:12px;color:#ffe2a8;margin-top:2px}
</style>
</head>
<body>

<div class="intro" id="intro">
  <div class="intro-stage">
    <div class="intro-line" id="introL1">ARCH-OS · LONG NIGHT ARCHIVE · NODE 07</div>

<aside class="drawer" id="drawer">

  <p class="note">听一段四音回声，再按相同顺序按下铃键。它不影响主线档案与答案，只是夜班里的一点消遣。</p>
  <div class="bell-keys" id="bellKeys"></div>
  <div class="bell-status" id="bellStatus">准备中……</div>

<script>
/* ================= 常量与状态 ================= */
const VER="ln-archive-3.3";
const SAVE="ln_save_2";

const RECS=[
 {id:"R1",no:"01",name:"值班磁带",sub:"录音 · 交接",art:"tape"},
 {id:"R2",no:"02",name:"屋顶照片",sub:"相片 · 1998",art:"photo"},
 {id:"R3",no:"03",name:"封存包尾部",sub:"二进制 · 转储",art:"hex"},
 {id:"R4",no:"04",name:"塔的呼吸",sub:"频谱 · 呼号",art:"spec"},
 {id:"R5",no:"05",name:"归航星图",sub:"星图 · 环",art:"star"},
 {id:"R6",no:"06",name:"配线盘",sub:"路由 · 授权",art:"patch"},
 {id:"R7",no:"07",name:"结项终端",sub:"发送 · 协议",art:"end"}
];
const HID={id:"R3B",no:"03-B",name:"黑匣子",sub:"未登记 · 私人物",art:"crate",hid:true};
const SUB1={id:"R6B",no:"06-B",name:"冷却回路",sub:"冷却 · 校验",art:"pipe",hid:true};

const KEYS={
  pk:{k:"解析密钥",v:"B7K2",n:"封存包尾部 ASCII 列读出的访问密钥"},
  bay:{k:"机柜编号",v:"07",n:"值班磁带中报出的机柜号"},
  year:{k:"封存年份",v:"1998",n:"屋顶照片边角手写日期"},
  call:{k:"旧呼号",v:"KITE",n:"频谱仪上半频段的呼号"},
  az:{k:"归航方位",v:"213",n:"星图环对齐后的顶端刻度"},
  sum:{k:"流量校验码",v:"0719",n:"冷却回路接通后，流量计打印的四位校验码"}
};

function blank(){return {ver:VER, max:0, done:{}, keys:{}, hints:{}, hidden:false, notes:[], lamps:[], eggs:[], t0:null, cur:-1, seen:false}}
let S=loadState();
function loadState(){
  try{
    const raw=localStorage.getItem(SAVE); if(!raw) return blank();
    const o=JSON.parse(raw); if(!o||!o.ver||String(o.ver).indexOf("ln-archive")!==0) return blank();
    return Object.assign(blank(),o);
  }catch(e){return blank()}
}
function save(){ try{ localStorage.setItem(SAVE,JSON.stringify(S)) }catch(e){} }

/* ================= 工具 ================= */
const $=id=>document.getElementById(id);
function el(tag,cls,txt){const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e}
function toast(t){const n=$("toast"); n.textContent=t; n.classList.add("show"); clearTimeout(n._t); n._t=setTimeout(()=>n.classList.remove("show"),1900)}
function rng(seed){let s=seed||7; return function(){s=(s*16807)%2147483647; return s/2147483647}}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"})[c])}
function note(t){ if(!S.notes.includes(t)){S.notes.push(t)} }

/* ================= 音频引擎（全程序合成，无外部文件） ================= */
const AU={ctx:null,on:(localStorage.getItem("ln_audio")!=="0"),amb:null,noiseGain:null,tone:null,toneGain:null};
function auInit(){
  if(AU.ctx) return AU.ctx;
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
    const c=new AC(); AU.ctx=c;
    // 环境低鸣
    const g=c.createGain(); g.gain.value=.0001; g.connect(c.destination);
    const o1=c.createOscillator(); o1.type="sine"; o1.frequency.value=52;
    const o2=c.createOscillator(); o2.type="triangle"; o2.frequency.value=104; o2.detune.value=7;
    const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=360;
    o1.connect(lp); o2.connect(lp); lp.connect(g); o1.start(); o2.start();
    g.gain.exponentialRampToValueAtTime(AU.on?.011:.0001, c.currentTime+2.4);
    AU.amb=g;
    // 磁带/通风噪声床
    const buf=c.createBuffer(1,Math.floor(c.sampleRate*2),c.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*.45;
    const ns=c.createBufferSource(); ns.buffer=buf; ns.loop=true;
    const nf=c.createBiquadFilter(); nf.type="bandpass"; nf.frequency.value=640; nf.Q.value=.8;
    const ng=c.createGain(); ng.gain.value=.0001; ns.connect(nf); nf.connect(ng); ng.connect(c.destination);
    ns.start();
    ng.gain.exponentialRampToValueAtTime(AU.on?.003:.0001, c.currentTime+2.4);
    AU.noiseGain=ng; AU.noiseSource=ns;
    // 调谐音（常驻正弦，增益随锁定变化）
    const t=c.createOscillator(); t.type="sine"; t.frequency.value=520;
    const tg=c.createGain(); tg.gain.value=0; t.connect(tg); tg.connect(c.destination); t.start();
    AU.tone=t; AU.toneGain=tg;
  }catch(e){ AU.ctx=null }
  return AU.ctx;
}
function auWake(){ if(!AU.on) return; const c=auInit(); if(c&&c.state==="suspended"){ try{c.resume()}catch(e){} } }
function beep(f,dur,type,vol,delay){
  if(!AU.on||!AU.ctx) return; const c=AU.ctx;
  try{
    const t0=c.currentTime+(delay||0);
    const o=c.createOscillator(); o.type=type||"sine"; o.frequency.setValueAtTime(f,t0);
    const g=c.createGain(); g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol||.06,t0+.008);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+.02);
  }catch(e){}
}
const SND={
  click:()=>beep(760,.05,"triangle",.05),
  hover:()=>beep(1180,.03,"sine",.018),
  tick:()=>beep(1500,.02,"square",.02),
  ok:()=>{ beep(523,.16,"sine",.07,0); beep(659,.18,"sine",.06,.11); beep(784,.3,"sine",.07,.24) },
  err:()=>{ beep(190,.2,"square",.05,0); beep(140,.26,"square",.04,.09) },
  relay:()=>{ beep(120,.09,"square",.07,0); beep(340,.05,"triangle",.03,.05) },
  tape:()=>{ beep(300,.5,"sawtooth",.015,0) },
  chime:()=>{ beep(880,.5,"sine",.05,0); beep(1320,.6,"sine",.03,.2) }
};
function auTone(freq,amp){
  if(!AU.on||!AU.toneGain) return;
  const c=AU.ctx; if(!c) return;
  try{ AU.tone.frequency.setTargetAtTime(freq,c.currentTime,.12);
       AU.toneGain.gain.setTargetAtTime(amp,c.currentTime,.1) }catch(e){}
}
function auMute(on){
  AU.on=on; try{localStorage.setItem("ln_audio",on?"1":"0")}catch(e){}
  const c=AU.ctx;
  if(c){
    try{
      const t=c.currentTime;
      if(AU.amb) AU.amb.gain.setTargetAtTime(on?.011:.0001,t,.3);
      if(AU.noiseGain) AU.noiseGain.gain.setTargetAtTime(on?.003:.0001,t,.3);
      if(AU.toneGain&&!on) AU.toneGain.gain.setTargetAtTime(0,t,.2);
    }catch(e){}
  }
  const b=$("btnAudio"); if(b){ b.textContent=on?"声 · 开":"声 · 关"; b.classList.toggle("off",!on) }
}

/* ================= v3.3 彩蛋（无阻断，不影响主线真值与门禁） ================= */
const EGG_DEFS={
  beacon:{name:"值班窗",n:"封面卫星上唯一亮着的窗，被你点了三次"},
  signal:{name:"循环信号",n:"顶栏信号条被你连点五次"},
  weld:{name:"焊死的格",n:"06-B 里焊死的格子，其实也有温度"},
  earth:{name:"蓝色弹珠",n:"结局页那颗收信的星球"},
  bell:{name:"铃音校准",n:"值班铃的四音回声被你完整复现"}
};
const eggHits={};
function unlockEgg(id){
  if(S.eggs.includes(id)) return false;
  S.eggs.push(id); save(); SND.chime();
  const def=EGG_DEFS[id];
  toast("彩蛋发现 · "+def.name+"（"+S.eggs.length+"/"+Object.keys(EGG_DEFS).length+"）");
  return true;
}
function pokeEgg(id){
  const need={beacon:3,signal:5,weld:3}[id]||1;
  eggHits[id]=(eggHits[id]||0)+1;
  if(eggHits[id]>=need) unlockEgg(id);
}
document.addEventListener("click",e=>{
  const t=e.target&&e.target.closest?e.target.closest("[data-egg]"):null;
  if(t) pokeEgg(t.dataset.egg);
});

/* ================= v3.3 开场过场（可跳过） ================= */
let introTimers=[];
function finishIntro(){
  introTimers.forEach(clearTimeout); introTimers=[];
  const el=$("intro"); if(!el) return;
  el.classList.add("done");
  try{ localStorage.setItem("ln_intro","1") }catch(e){}
}
function runIntro(){
  const el=$("intro"); if(!el) return;
  try{ if(localStorage.getItem("ln_intro")==="1"){ el.classList.add("done"); return } }catch(e){}
  el.classList.remove("done");
  const bar=$("introBar"); bar.classList.remove("run"); void bar.offsetWidth; bar.classList.add("run");
  introTimers.push(setTimeout(()=>$("introL1").classList.add("on"),350));
  introTimers.push(setTimeout(()=>{ $("introPulse").classList.add("on"); $("introL2").classList.add("on"); SND.hover(); },1700));
  introTimers.push(setTimeout(()=>$("introTitle").classList.add("on"),3700));
  introTimers.push(setTimeout(finishIntro,5600));
  $("introSkip").onclick=e=>{ e.stopPropagation(); finishIntro() };
  el.addEventListener("click",()=>finishIntro(),{once:true});
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") finishIntro() });
}

/* ================= v3.3 值班铃（可选回声小游戏，不影响主线） ================= */
const BELL_NOTES=[{label:"DO",f:523.25},{label:"MI",f:659.25},{label:"SOL",f:783.99},{label:"LA",f:880.00}];
const BELL_SEQ=[0,2,1,3];
let bellInput=[],bellBusy=false;
function bellTone(i){ beep(BELL_NOTES[i].f,.28,"sine",.08,0) }
function bellFlash(i){ const k=$("bellKeys").children[i]; if(!k) return; k.classList.add("lit"); setTimeout(()=>k.classList.remove("lit"),360) }
function buildBellKeys(){
  const box=$("bellKeys"); box.innerHTML="";
  BELL_NOTES.forEach((n,i)=>{
    const b=el("button","bellkey",n.label);
    b.addEventListener("click",()=>{
      bellTone(i); bellFlash(i);
      if(bellBusy) return;
      bellInput.push(i);
      if(i!==BELL_SEQ[bellInput.length-1]){
        const st=$("bellStatus"); st.className="bell-status bad"; st.textContent="顺序不对，再听一次。";
        SND.err(); bellInput=[]; bellBusy=true;
        setTimeout(()=>playBellSeq(()=>{bellBusy=false;st.className="bell-status";st.textContent="轮到你：按刚才的顺序按下铃键。";}),750);
        return;
      }
      if(bellInput.length===BELL_SEQ.length){
        const st=$("bellStatus"); st.className="bell-status ok"; st.textContent="回声对齐 · 铃音校准完成。";
        unlockEgg("bell"); SND.ok(); setTimeout(bellClose,1100);
      }
    });
    box.appendChild(b);
  });
}
function playBellSeq(done){
  bellBusy=true; let k=0;
  const step=()=>{
    if(k>=BELL_SEQ.length){ bellBusy=false; if(done) done(); return }
    bellTone(BELL_SEQ[k]); bellFlash(BELL_SEQ[k]); k++; setTimeout(step,520);
  };
  step();
}
function bellOpen(){
  $("bellMask").classList.add("open"); $("bellModal").classList.add("open");
  bellInput=[]; bellBusy=true;
  const st=$("bellStatus"); st.className="bell-status"; st.textContent="听旋律……";
  buildBellKeys();
  playBellSeq(()=>{ bellBusy=false; st.textContent="轮到你：按刚才的顺序按下铃键。"; });
}
function bellClose(){ $("bellMask").classList.remove("open"); $("bellModal").classList.remove("open"); bellInput=[]; bellBusy=false }

/* ================= 灯（每份档案藏一盏，点亮即收集） ================= */
function lampAt(parent,key,pos){
  const d=el("div","lamp"); d.title="这里有一点光。";
  d.style.cssText=Object.keys(pos).map(k=>k+":"+pos[k]).join(";");
  const on=()=>{ if(S.lamps.includes(key)) return;
    S.lamps.push(key); save(); d.classList.add("on"); SND.chime();
    const n=S.lamps.length;
    toast("第 "+n+" 盏灯亮起 · "+n+"/7");
    renderProg();
  };
  if(S.lamps.includes(key)) d.classList.add("on");
  d.addEventListener("click",e=>{ e.stopPropagation(); on() });
  parent.appendChild(d);
  return d;
}

/* ================= 归档仪式 / 进度 ================= */
function archivedFx(){
  const fx=$("archFx"); if(!fx) return;
  const tt=fx.querySelector(".tt"); if(tt) tt.textContent="ARCHIVED";
  fx.classList.remove("on"); void fx.offsetWidth; fx.classList.add("on");
  SND.ok();
}
/* 发送/转场仪式：全屏扫描 → 回调 */
function transmitFx(label,next){
  const fx=$("archFx");
  if(!fx){ next(); return }
  const tt=fx.querySelector(".tt"); if(tt) tt.textContent=label;
  fx.classList.remove("on"); void fx.offsetWidth; fx.classList.add("on");
  SND.ok();
  setTimeout(()=>{ try{next()}catch(e){} },2500);
}
function renderProg(){
  const bar=$("progBar"); if(!bar) return;
  bar.innerHTML="";
  RECS.forEach(r=>{ const i=document.createElement("i"); if(S.done[r.id]) i.classList.add("on"); bar.appendChild(i) });
  [HID,SUB1].forEach(h=>{ const i=document.createElement("i"); if(S.done[h.id]) i.classList.add("hid"); bar.appendChild(i) });
  const n=RECS.filter(r=>S.done[r.id]).length;
  const extra=[HID,SUB1].filter(h=>S.done[h.id]).length;
  const lb=$("progLab"); if(lb) lb.textContent=n+" / 7"+(extra?" +"+extra:"");
  const lc=$("lampCount"); if(lc){ lc.textContent="◆ "+S.lamps.length+"/7"; lc.classList.toggle("full",S.lamps.length>=7) }
}


/* 状态推进 */
function unlockNext(id){
  const i=RECS.findIndex(r=>r.id===id);
  if(i>=0 && S.max < i+1) S.max=i+1;
}
function solve(id,opt){
  opt=opt||{};
  if(S.done[id]) return false;
  S.done[id]=true;
  if(!S.t0) S.t0=Date.now();
  if(opt.keys) Object.keys(opt.keys).forEach(k=>{S.keys[k]=opt.keys[k]});
  if(opt.note) note(opt.note);
  if(opt.hidden) S.hidden=true;
  unlockNext(id);
  save();
  if(opt.idx!=null) S.cur=opt.idx;
  renderRail(); renderNode(); renderProg();
  archivedFx();
  return true;
}
const GATE={
  R1:()=>true,
  R2:()=>true,
  R3:()=>!!S.done.R1,
  R4:()=>!!S.done.R3,
  R5:()=>!!S.done.R4,
  R6:()=>!!S.done.R4,
  R6B:()=>!!(S.done.R5||S.done.R6),
  R7:()=>!!S.done.R6B
};
function accessible(i){
  const rec=RECS[i]; if(!rec) return false;
  const g=GATE[rec.id]; return g?g():false;
}
function renderRail(){
  const r=$("rail"); r.innerHTML="";
  const hd=el("div","rail-h");
  hd.innerHTML=`<span>档案柜 / RECORDS</span><span>${RECS.filter(x=>S.done[x.id]).length}/7</span>`;
  r.appendChild(hd);
  RECS.forEach((rec,i)=>{
    const ok=accessible(i), dn=!!S.done[rec.id];
    const d=el("div","rec");
    if(!ok) d.classList.add("lk");
    if(S.cur===i) d.classList.add("cur");
    if(dn) d.classList.add("dn");
    d.innerHTML=`<div class="no">${rec.no}</div><div><div class="nm">${rec.name}</div>
      <div class="st">${dn?"已归档":(ok?"待核对":"未解锁")}</div></div>`;
    if(ok) d.addEventListener("mouseenter",()=>SND.hover());
    d.addEventListener("click",()=>{ if(ok) open(i); else toast("该档案尚未解锁：先完成上一份。") });
    r.appendChild(d);
  });
  if(S.hidden){
    const d=el("div","rec hid"); if(S.cur===-2) d.classList.add("cur");
    if(S.done[HID.id]) d.classList.add("dn");
    d.innerHTML=`<div class="no">${HID.no}</div><div><div class="nm">${HID.name}</div>
      <div class="st">${S.done[HID.id]?"已抄录":"未登记"}</div></div>`;
    d.addEventListener("mouseenter",()=>SND.hover());
    d.addEventListener("click",()=>open(-2));
    r.appendChild(d);
  }
  if(GATE.R6B()){
    const d=el("div","rec sub"); if(S.cur===-4) d.classList.add("cur");
    if(S.done[SUB1.id]) d.classList.add("dn");
    d.innerHTML=`<div class="no">${SUB1.no}</div><div><div class="nm">${SUB1.name}</div>
      <div class="st">${S.done[SUB1.id]?"已归档":"待接通"}</div></div>`;
    d.addEventListener("mouseenter",()=>SND.hover());
    d.addEventListener("click",()=>open(-4));
    r.appendChild(d);
  }
  const f=el("div","rail-foot");
  const lamps="";
  f.innerHTML=`SHELL: ARCH-OS 3.0<br>UPTIME 41y 02m<br>LISTENER: 1

/* ================= 档案 03：封存包尾部 ================= */
function hexBytes(seed){
  const r=rng(seed); const out=[];
  for(let i=0;i<64;i++){
    const arr=[]; for(let j=0;j<16;j++) arr.push(Math.floor(r()*256));
    out.push(arr);
  }
  return out;
}
function asciiOf(bytes){
  return bytes.map(b=> (b>=32&&b<127)? String.fromCharCode(b) : ".").join("");
}
function hexLine(off,bytes,cls){
  const h=bytes.map(b=>b.toString(16).toUpperCase().padStart(2,"0")).join(" ").replace(/(.. ){8}/,"$& ");
  const a=asciiOf(bytes).replace(/</g,"&lt;");
  return `<span class="${cls||''}" data-off="${off}">${off.toString(16).toUpperCase().padStart(4,"0")}  ${h.padEnd(48," ")}  |${a}|</span>`;
}
function textToBytes(txt){
  const b=[]; for(let i=0;i<txt.length && i<16;i++) b.push(txt.charCodeAt(i));
  while(b.length<16) b.push(0);
  return b;
}
M.R3=function(st){
  const p=el("div","panel");
  p.appendChild(shellHead("RECORD 03 · 封存包尾部","SEALED-PKG / 0400—04FF 区段","转储工具：只读 / 文件头不匹配 / 尾部缝合了非图像协议"));
  const hv=hero("cross",["SEALED-PKG 0400—04FF","STRUCTURE CROSS-SECTION"]);
  p.appendChild(hv);
  const b=el("div","body");
  b.innerHTML=`<p class="lede">这个封存包在归档时被"加过尾巴"。文件头仍然是图像，尾部却被另一种协议缝合了十六个字节的溢出数据。
    工具只认十六进制——<b>拉到最底</b>看最右边那一列 ASCII，并在地址列里<b>点出越界起点</b>（图像协议结束的那一行）。</p>
    <div class="toolbar">
      <input type="text" id="goOff" placeholder="输入地址，如 0400" style="width:170px">
      <button class="btn sm" id="btnGoOff">定位</button>
      <button class="btn sm" id="btnTail">跳到尾部 ›</button>
      <span class="msg" id="goMsg" style="flex:1"></span>
    </div>`;
  const box=el("div","hexbox");
  const rows=hexBytes(1998);
  let html="";
  rows.forEach((bytes,i)=>{
    let cls=(i%7===0)?"dim":"";
    html+=hexLine(i*16,bytes,cls)+"\n";
  });
  // 尾部异常
  const tail=[
    {off:0x0400, bytes:textToBytes(">>> SEGMENT: TAIL "), cls:"dim"},
    {off:0x0410, bytes:textToBytes("  KEY=B7K2      "), cls:"hot"},
    {off:0x0420, bytes:textToBytes("  PATH:/vault/b7"), cls:"hot"},
    {off:0x0430, bytes:textToBytes(">>> EOF          "), cls:"dim"}
  ];
  b.appendChild(box);
  const goOff=b.querySelector("#goOff"), btnGo=b.querySelector("#btnGoOff"), btnTail=b.querySelector("#btnTail"), goMsg=b.querySelector("#goMsg");
  function jumpTo(off){
    const sp=box.querySelector(`span[data-off="${off}"]`);
    if(!sp){ goMsg.textContent="这个地址不在转储范围内（0x0000—0x0440）。"; goMsg.className="msg e"; SND.err(); return }
    sp.scrollIntoView({block:"center",behavior:"smooth"});
    goMsg.textContent="已定位到 0x"+off.toString(16).toUpperCase().padStart(4,"0"); goMsg.className="msg"; SND.tick();
  }
  btnGo.addEventListener("click",()=>{
    const raw=goOff.value.trim().replace(/^0x/i,"");
    if(!/^[0-9a-fA-F]{1,4}$/.test(raw)){ goMsg.textContent="地址应为十六进制，例如 0400。"; goMsg.className="msg e"; SND.err(); return }
    jumpTo(parseInt(raw,16));
  });
  btnTail.addEventListener("click",()=>jumpTo(0x0400));
  tail.forEach(t=>{ html+=hexLine(t.off,t.bytes,t.cls)+"\n" });
  html+=hexLine(0x0440,textToBytes("        0x00 END"),"dim");
  box.innerHTML=html;
  const tv=el("div","tailview");
  tv.innerHTML=`<div class="tvh">TAIL VIEW · 越界数据（不属于图像协议）</div>
    <div class="tvl">&gt;&gt;&gt; SEGMENT: TAIL</div>
    <div class="tvl hl">KEY=B7K2</div>
    <div class="tvl hl">PATH: /vault/b7</div>
    <div class="tvl">&gt;&gt;&gt; EOF</div>`;
  box.appendChild(tv);
  b.appendChild(el("div","","")).style.marginTop="6px";
  const tip=el("div"); tip.style.cssText="font-size:12px;color:var(--tx3);margin-top:8px";
  tip.innerHTML='读法：ASCII 列里多是点号，只有真正的文本才显形；点左边任意一行可以标记它。';
  b.appendChild(tip);

  // 越界起点标记（互动）
  let selOff=-1;
  const selLine=el("div");
  selLine.style.cssText="font-family:var(--mono);font-size:11px;color:var(--tx3);margin-top:6px;letter-spacing:1px";
  selLine.textContent="越界起点：未标记";
  box.addEventListener("click",e=>{
    const t=e.target; const sp=(t&&t.closest)?t.closest("span[data-off]"):null;
    if(!sp) return;
    box.querySelectorAll("span.sel").forEach(x=>x.classList.remove("sel"));
    sp.classList.add("sel");
    selOff=+sp.dataset.off;
    SND.tick();
    selLine.textContent="越界起点："+selOff.toString(16).toUpperCase().padStart(4,"0")+"（再点别处可改）";
    selLine.style.color="var(--cy)";
  });
  b.appendChild(selLine);

  // 路径输入
  b.appendChild(el("div","sub","挂载隐藏目录"));
  const row=el("div","row");
  const pin=document.createElement("input"); pin.type="text"; pin.placeholder="/vault/____"; pin.style.width="210px"; pin.maxLength=24;
  const pbtn=el("button","btn go","打开路径");
  const pmsg=el("div","msg"); pmsg.style.flexBasis="100%";
  row.appendChild(pin); row.appendChild(pbtn); row.appendChild(pmsg);
  b.appendChild(row);
  if(S.hidden){
    pin.disabled=true; pbtn.disabled=true;
    pmsg.textContent="已挂载 /vault/b7：其中有一件未登记的私人物。"; pmsg.className="msg s";
  }
  pbtn.addEventListener("click",()=>{
    const v=pin.value.trim().toLowerCase().replace(/^https?:\/\/[^/]*/,"").replace(/ /g,"");
    if(!S.hidden && selOff!==0x0400){
      pmsg.textContent=selOff<0
        ? "先标出越界起点：在地址列里点一下图像数据结束、尾巴开始的那一行。"
        : "起点标错了：0x"+selOff.toString(16).toUpperCase().padStart(4,"0")+" 还是原图像的字节。"; 
      pmsg.className="msg e"; return;
    }
    if(v==="/vault/b7" || v==="vault/b7"){
      pmsg.textContent="挂载成功。档案柜里多了一件没有编号的东西。"; pmsg.className="msg s";
      solve("R3",{keys:{pk:"B7K2"},hidden:true,note:"封存包尾部读出的密钥 B7K2；同时挂载了未登记的目录 /vault/b7。"});
      pin.disabled=true; pbtn.disabled=true;
      renderRail();
      const res=el("div","done-strip");
      res.innerHTML=`<div class="k">RECOVERED</div><div><div class="v">解析密钥 B7K2 · 隐藏目录 /vault/b7 已挂载</div>
        <div class="k" style="margin-top:3px">档案柜中出现了「03-B 黑匣子」</div></div>`;
      b.appendChild(res);
      const go=el("div","navfoot"); const r2=el("div");
      const bb=el("button","btn go","打开 03-B 黑匣子 ›");
      bb.addEventListener("click",()=>open(-2));
      r2.appendChild(bb); go.appendChild(el("div","")); go.appendChild(r2); b.appendChild(go);
    }else{
      pmsg.textContent="路径不存在。ASCII 列里的那一行是完整的挂载点。"; pmsg.className="msg e";
      pin.classList.add("bad"); setTimeout(()=>pin.classList.remove("bad"),350);
    }
  });
  p.appendChild(b); st.appendChild(p);
};

/* ================= 档案 04：塔的呼吸（频谱） ================= */
M.R4=function(st){
  const p=el("div","panel");
  p.appendChild(shellHead("RECORD 04 · 塔的呼吸","上行链路 / 12.4 kHz 带宽","频谱记录 / 41 秒循环 / 天线已停转，缓存里还留着最后一圈"));
  const hv=hero("spec",["UPLINK 12.4 kHz · 41 s LOOP","TUNE 40.00 — 42.00 kHz"]);
  p.appendChild(hv);
  lampAt(hv,"R4",{left:"16px",bottom:"40px"});
  const b=el("div","body");
  b.innerHTML=`<p class="lede">塔在向下发送一段很短的呼号，一直重复。噪声压得很低，
    <b>四个旋钮都要对</b>：把<b>增益</b>拉起来、把<b>频段窗</b>抬到上半频段、把<b>接收带宽</b>收到 4 kHz 以内，再用<b>调谐</b>扫出那条载波——<br>
    带宽太宽，四个字母会糊成一片；只有载波也对上，它们才会从噪声里浮出来。<br>
    <span style="color:var(--am);font-size:12.5px">旧制读法：自右向左。字母的先后是右、左，不是左、右。</span><br>
    <span style="color:var(--tx3);font-size:12.5px">也可以用耳朵：打开监听，越接近载波，底下的嗡鸣越低、越稳。</span></p>`;

  const box=el("div","specbox");
  const cvs=document.createElement("canvas"); cvs.width=720; cvs.height=340;
  cvs.style.width="100%"; cvs.style.height="auto";
  box.appendChild(cvs);
  b.appendChild(box);

  const ctrl=el("div"); ctrl.style.cssText="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:10px";
  ctrl.innerHTML=`
    <label class="slider"><span class="lb"><span>增益</span><b id="vG">18</b></span>
      <input type="range" id="sG" min="0" max="100" step="1" value="18"></label>
    <label class="slider"><span class="lb"><span>频段窗</span><b id="vB">206</b></span>
      <input type="range" id="sB" min="40" max="300" step="1" value="206"></label>
    <label class="slider"><span class="lb"><span>接收带宽</span><b id="vW">8.0</b></span>
      <input type="range" id="sW" min="1" max="8" step="0.5" value="8"></label>
    <label class="slider" style="grid-column:1/-1"><span class="lb"><span>调谐（扫频找载波）</span><b id="vT">40.000</b></span>
      <input type="range" id="sT" min="40" max="42" step="0.01" value="40"></label>`;
  b.appendChild(ctrl);

  let gain=18, band=206, bw=8, tune=40, listen=true, lockedOnce=false;
  function tv2(){ return Math.max(0,Math.min(1,1-Math.abs(tune-41.02)/0.10)) }
  function updTone(){
    if(!listen){ auTone(0,0); return }
    const d=Math.abs(tune-41.02);
    const f=240+Math.min(1800,d*950);
    const tvv=tv2();
    auTone(f,0.0035+tvv*0.028);
    if(tvv>0.92 && !lockedOnce){ lockedOnce=true; SND.chime(); toast("载波锁定 · 41.02 kHz") }
    if(tvv<=0.92) lockedOnce=false;
  }
  function draw(){
    const g=cvs.getContext("2d"); if(!g) return;
    g.clearRect(0,0,720,340);
    g.fillStyle="#03060a"; g.fillRect(0,0,720,340);
    g.strokeStyle="rgba(45,106,128,.40)"; g.lineWidth=1;
    for(let x=0;x<=720;x+=48){ g.beginPath(); g.moveTo(x+.5,0); g.lineTo(x+.5,340); g.stroke() }
    for(let y=0;y<=340;y+=34){ g.beginPath(); g.moveTo(0,y+.5); g.lineTo(720,y+.5); g.stroke() }
    const r=rng(7919);
    const na=(0.05+(100-gain)/100*0.38);
    for(let i=0;i<280;i++){
      const x=r()*720, y=r()*340, w=1+r()*6, h=1+r()*3;
      g.fillStyle=`rgba(${y<170?124:89},${y<170?240:184},${y<170?192:255},${na.toFixed(3)})`;
      g.fillRect(x,y,w,h);
    }
    const gv=Math.max(0,Math.min(1,(gain-52)/28));
    const tv=Math.max(0,Math.min(1,1-Math.abs(tune-41.02)/0.10));
    const bv=(bw<=4.2)?1:0.55-(bw-4.2)*0.06;
    const vis=gv*tv*bv;
    const crisp=(bw<=4.2);
    // 载波峰线
    g.strokeStyle=`rgba(255,206,106,${(0.05+vis*0.5).toFixed(2)})`; g.lineWidth=1;
    g.beginPath(); g.moveTo(0,168.5); g.lineTo(720,168.5); g.stroke();
    g.font="bold 64px ui-monospace,Menlo,Consolas,monospace";
    g.textBaseline="middle"; g.textAlign="left";
    if(vis>0.02){
      ["E","T","I","K"].forEach((ch,i)=>{
        const x=150+i*140;
        if(crisp){
          g.save();
          g.globalAlpha=0.12+vis*0.88;
          g.shadowColor="#7cf0c0"; g.shadowBlur=20;
          g.fillStyle="#b9ffe6"; g.fillText(ch,x,120);
          g.restore();
        }else{
          // 带宽太宽：同一组字母被糊成一片
          const sp=Math.min(9,(bw-4)*2.2);
          for(let k=0;k<5;k++){
            g.save();
            g.globalAlpha=(0.10+vis*0.5)*0.4;
            g.shadowColor="#7cf0c0"; g.shadowBlur=26;
            g.fillStyle="#b9ffe6";
            g.fillText(ch,x+(k-2)*sp,120+(k%2?2:-2));
            g.restore();
          }
        }
      });
    }
    const bt=Math.max(0,band-34), bb=Math.min(340,band+34);
    g.fillStyle="rgba(3,7,11,.88)";
    g.fillRect(0,0,720,bt); g.fillRect(0,bb,720,340-bb);
    g.strokeStyle="rgba(255,206,106,.6)"; g.lineWidth=1;
    g.beginPath(); g.moveTo(0,bt+.5); g.lineTo(720,bt+.5); g.stroke();
    g.beginPath(); g.moveTo(0,bb+.5); g.lineTo(720,bb+.5); g.stroke();
    g.font="9px ui-monospace,monospace"; g.fillStyle="#4e8f7c"; g.textAlign="left";
    g.fillText("GAIN "+gain,10,18); g.textAlign="right"; g.fillText("BAND "+band+" / BW "+bw.toFixed(1)+"k  ",710,18);
    g.textAlign="left"; g.fillStyle="rgba(255,206,106,.85)"; g.fillText("TUNE "+tune.toFixed(3)+" kHz",10,332);
    g.textAlign="right";
    const ok=(tv>0.85&&gv>0.7&&crisp);
    g.fillStyle=ok?"#7cf0c0":"#c9695f";
    g.fillText(ok?"CARRIER: LOCKED":(tv>0.85&&gv>0.7?"BAND TOO WIDE":"CARRIER: NO LOCK  "),710,332);
    g.fillStyle="#3d5f6b"; g.textAlign="left"; g.fillText("UPPER",10,bt-6); g.fillText("LOWER",10,bb+14);
  }
  draw();
  const sg=ctrl.querySelector("#sG"), sb=ctrl.querySelector("#sB"), stn=ctrl.querySelector("#sT");
  const sw=ctrl.querySelector("#sW");
  const vg=ctrl.querySelector("#vG"), vb=ctrl.querySelector("#vB"), vt=ctrl.querySelector("#vT"), vw=ctrl.querySelector("#vW");
  if(S.done.R4){ bw=3; sw.value="3"; vw.textContent="3.0"; draw(); }
  sg.addEventListener("input",e=>{ gain=+e.target.value; vg.textContent=gain; draw() });
  sb.addEventListener("input",e=>{ band=+e.target.value; vb.textContent=band; draw(); SND.tick() });
  sw.addEventListener("input",e=>{ bw=+e.target.value; vw.textContent=bw.toFixed(1); draw(); SND.tick() });
  stn.addEventListener("input",e=>{ tune=+e.target.value; vt.textContent=tune.toFixed(3); draw(); auWake(); updTone() });
  const lrow=el("div","row"); lrow.style.marginTop="8px";
  const lb=el("button","btn sm on","监听 · 开");
  lb.addEventListener("click",()=>{ auWake(); listen=!listen; lb.classList.toggle("on",listen);
    lb.textContent=listen?"监听 · 开":"监听 · 关"; if(!listen) auTone(0,0); else {lu();} });
  function lu(){ if(listen) updTone() }
  const lhint=el("div","msg"); lhint.style.flexBasis="100%"; lhint.textContent="嗡鸣越低、越稳，说明离载波越近。";
  lrow.appendChild(lb); lrow.appendChild(lhint);
  b.appendChild(lrow);

  b.appendChild(el("div","sub","录入呼号（四字母）"));
  const row=el("div","row");
  const cin=document.createElement("input"); cin.type="text"; cin.maxLength=6; cin.placeholder="____"; cin.style.width="130px";
  cin.style.textTransform="uppercase"; cin.style.letterSpacing="8px";
  const cbtn=el("button","btn go","写入");
  const cmsg=el("div","msg"); cmsg.style.flexBasis="100%";
  row.appendChild(cin); row.appendChild(cbtn); row.appendChild(cmsg); b.appendChild(row);
  if(S.done.R4){ cin.disabled=true; cbtn.disabled=true; cmsg.textContent="已归档：旧呼号 KITE。"; cmsg.className="msg s"; }
  cbtn.addEventListener("click",()=>{
    const v=cin.value.trim().toUpperCase().replace(/\s/g,"");
    if(v==="KITE" && bw>4.2){
      cmsg.textContent="先别写：带宽还开着，字母糊在一起，现在写进去只是猜。把接收带宽收窄到 4 kHz 以内。"; cmsg.className="msg e";
      return;
    }
    if(v==="KITE"){
      cmsg.textContent="呼号确认：KITE。这条链路 41 年没有换过呼号。"; cmsg.className="msg s";
      cin.disabled=true; cbtn.disabled=true;
      solve("R4",{keys:{call:"KITE"},note:"塔的呼号是 KITE（上半频段，自右向左读）；41 年来一直在循环同一条链路。"});
      const d=el("div","done-strip");
      d.innerHTML=`<div class="k">CALLSIGN</div><div><div class="v">KITE — 四个字母，41 年未改。</div>
        <div class="k" style="margin-top:3px">旧呼号 = KITE</div></div>`;
      b.appendChild(d);
      b.appendChild(footNav(3,()=>open(4),"下一份：归航星图 ›"));
    }else{
      cmsg.textContent="与频谱记录不一致。注意：读法自右向左。"; cmsg.className="msg e";
      cin.classList.add("bad"); setTimeout(()=>cin.classList.remove("bad"),350);
    }
  });
  p.appendChild(b); st.appendChild(p);
};

/* ================= 档案 05：归航星图 ================= */
M.R5=function(st){
  const p=el("div","panel");
  p.appendChild(shellHead("RECORD 05 · 归航星图","NAV / 静默轨道 · 三颗等距星","星图盘 / 外环可旋转 15° 一格 / 内圈为旧航路标记"));
  const hv=hero("star",["NAV PLATE · 24 TICKS","RING 15° / STEP"]);
  p.appendChild(hv);
  lampAt(hv,"R5",{right:"18px",bottom:"40px"});
  const b=el("div","body");
  b.innerHTML=`<p class="lede">外环是一块可以转的铜盘。环上有三枚白点，
    内圈有三颗很亮的星——它们等距分布。<br>
    把三枚白点<b>各自对准</b>一颗星，读出环上<b>正对顶端刻度</b>的那一格数字，再把它登记进方位栏。</p>`;

  const W=720,H=400,CX=360,CY=200,R=150;

  function pol(a,rad){ const t=a*Math.PI/180; return [CX+Math.cos(t)*rad, CY+Math.sin(t)*rad] }
  const targets=[30,150,270].map((a,i)=>{const [x,y]=pol(a,R); return {a,x,y,rad:[92,78,88][i]}});
  const LBL=["041","004","317","128","266","074","199","302","055","238","011","287",

  }
  [45,165,285].forEach(a=>{ const [x,y]=pol(a,R); ring+=`<circle cx="${x}" cy="${y}" r="7.5" fill="#7cf0c0" opacity=".16"/><circle cx="${x}" cy="${y}" r="3.4" fill="#b6fff0" stroke="#7cf0c0" stroke-width="1"/>` });

  stg.innerHTML=`<svg viewBox="0 0 ${W} ${H}" id="ssvg">

    ${stars}
    <circle cx="${CX}" cy="${CY}" r="${R+22}" fill="none" stroke="#1e4a5c" stroke-width="1"/>

      <circle cx="${t.x}" cy="${t.y}" r="2.2" fill="#fff6e0"/></g>`).join("")}

    <line x1="${CX}" y1="${CY-176}" x2="${CX}" y2="${CY-160}" stroke="#ffce6a" stroke-width="2"/>
    <text x="${CX}" y="${CY-186}" text-anchor="middle" font-family="monospace" font-size="9" fill="#ffce6a">TOP</text>
  </svg>`;
  b.appendChild(stg);

  let ang=60, acc=null, wasAligned=false;

  // 登记方位（读出来还要写进去）

  const crow=el("div","row");

  ain.style.width="110px"; ain.style.letterSpacing="8px"; ain.style.textAlign="center";
  const abtn=el("button","btn go","登记方位");
  const amsg=el("div","msg"); amsg.style.flexBasis="100%";
  crow.appendChild(ain); crow.appendChild(abtn); crow.appendChild(amsg);
  cw.appendChild(crow);
  let registered=!!S.done.R5;
  abtn.addEventListener("click",()=>{
    if(registered) return;
    const v=ain.value.trim().replace(/[^0-9]/g,"");
    if(v!=="213"){ amsg.textContent="与环上的刻度不符：核对 TOP 指针正对的那一格。"; amsg.className="msg e"; ain.classList.add("bad"); setTimeout(()=>ain.classList.remove("bad"),350); return }
    registered=true;
    amsg.textContent="方位已登记：213。档案柜在等这个数。"; amsg.className="msg s";
    ain.disabled=true; abtn.disabled=true;
    solve("R5",{keys:{az:"213"},note:"星图环对齐后，顶端刻度读出归航方位 213。"});
    const d=el("div","done-strip");
    d.innerHTML=`<div class="k">AZIMUTH</div><div><div class="v">归航方位 213 — 三点共线，环停在这一格。</div>
      <div class="k" style="margin-top:3px">归航方位 = 213</div></div>`;

    const idx=(((18-(ang/15))%24)+24)%24;
    const aligned = ang===345;

    readout.textContent=`环角 ${String(ang).padStart(3,"0")}° · 顶端刻度 ${LBL[Math.round(idx)]}${aligned?" · 已对齐":""}`;

  if(!S.done.R5){ b.appendChild(cw) }

  }

  // 拖动
  let dragX=null, dragA=0;
  stg.addEventListener("pointerdown",e=>{ dragX=e.clientX; dragA=ang });

  });
  stg.addEventListener("pointerup",()=>dragX=null);
  stg.addEventListener("pointerleave",()=>dragX=null);
  setAng(ang);

  p.appendChild(b); st.appendChild(p);
};

  const mask=c=>((c.b<<c.r)|(c.b>>(4-c.r)))&15;

  function calc(){
    const seen=new Set(), q=[];
    if(mask(CELLS[4])&8){ seen.add(4); q.push(4) }
    const dirs=[[-1,0,1],[0,1,2],[1,0,4],[0,-1,8]];
    while(q.length){
      const idx=q.pop(), r=Math.floor(idx/COL), c=idx%COL, m=mask(CELLS[idx]);
      for(const [dr,dc,bit] of dirs){
        if(!(m&bit)) continue;
        const nr=r+dr, nc=c+dc; if(nr<0||nr>=COL||nc<0||nc>=COL) continue;
        const ni=nr*COL+nc, opp=({1:4,2:8,4:1,8:2})[bit];
        if(!(mask(CELLS[ni])&opp)) continue;
        if(!seen.has(ni)){ seen.add(ni); q.push(ni) }
      }
    }
    const out=seen.has(7)&&!!(mask(CELLS[7])&2);
    const nodes=seen.has(2)&&seen.has(9);
    return {seen,out,nodes,ok:out&&nodes};
  }

  const dirLine={1:[0,-1],2:[1,0],4:[0,1],8:[-1,0]};
  function render(){
    const gh=calc();
    const W=PAD*2+COL*CELL+(COL-1)*GAP, H=W;
    let cells="";
    for(let i=0;i<COL*COL;i++){
      const c=CELLS[i], r0=Math.floor(i/COL), c0=i%COL;
      const x=PAD+c0*(CELL+GAP), y=PAD+r0*(CELL+GAP), m=mask(c), cx=x+CELL/2, cy=y+CELL/2;
      const pw=gh.seen.has(i);
      let pipes="";
      for(const bit in dirLine){
        if(!(m&+bit)) continue;
        const [dx,dy]=dirLine[bit];
        pipes+=`<line x1="${cx}" y1="${cy}" x2="${cx+dx*CELL/2}" y2="${cy+dy*CELL/2}" stroke="${pw?'#7ff0c1':'#2b6a7c'}" stroke-width="${pw?3.4:2.6}" opacity="${pw?.95:.55}" class="${pw?'pw':''}"/>`;
      }
      cells+=`<g class="cell${c.lock?' lock':''}" data-i="${i}">
        <rect x="${x}" y="${y}" width="${CELL}" height="${CELL}" rx="6" fill="${c.lock?'rgba(24,34,40,.55)':'rgba(7,18,25,.5)'}" stroke="${pw?'rgba(127,240,193,.75)':'rgba(45,106,128,.5)'}" stroke-width="${pw?1.6:1}"/>
        <circle cx="${cx}" cy="${cy}" r="${pw?7:5}" fill="${pw?'rgba(127,240,193,.2)':'rgba(45,106,128,.18)'}" stroke="${pw?'#7ff0c1':'#2d6a80'}" stroke-width="1"/>
        ${c.node?`<circle cx="${cx}" cy="${cy}" r="12" fill="none" stroke="${warn(c,gh)?'#ff9f93':'#ffcb6b'}" stroke-width="1.6" opacity=".9"/>
          <circle cx="${cx}" cy="${cy}" r="15.5" fill="none" stroke="${warn(c,gh)?'#ff9f93':'#ffcb6b'}" stroke-width=".7" opacity=".45"/>`:""}
        ${c.lock?`<path d="M${cx-9},${cy-2} h18 M${cx-6},${cy-6} l12,12 M${cx+6},${cy-6} l-12,12" stroke="#44606c" stroke-width="1.2"/>`:""}
        ${pipes}
      </g>`;
    }
    box.innerHTML=`<svg viewBox="0 0 ${W} ${H}">
      <rect width="${W}" height="${H}" fill="none"/>
      <text x="4" y="${PAD+(CELL+GAP)*1+CELL/2+3}" font-family="monospace" font-size="8" fill="#59b8ff">IN</text>
      <text x="${W-4}" y="${PAD+(CELL+GAP)*1+CELL/2+3}" text-anchor="end" font-family="monospace" font-size="8" fill="#59b8ff">OUT</text>
      ${cells}
    </svg>`;
    // 状态
    gauge.className="gauge "+(gh.ok?"ok":"warn");
    if(gh.ok){
      gauge.innerHTML=`<span class="val">FLOW STABLE · 0.9 MPa</span><span class="note">两枚冷却节点都在回路上</span>`;
      if(!S.done.R6B) finish(gh);
    }else if(gh.out){
      gauge.innerHTML=`<span class="val">PRESSURE 2.4 MPa · 超压</span><span class="note">回路绕过了冷却节点：至少有一枚在环外</span>`;
    }else{
      gauge.innerHTML=`<span class="val">LOOP OPEN · 0.0 MPa</span><span class="note">冷却剂还没走到 OUT</span>`;
    }
    box.querySelectorAll(".cell").forEach(g=>{
      g.addEventListener("click",()=>{
        const i=+g.dataset.i;
        if(CELLS[i].lock){ SND.err(); pokeEgg("weld"); return }
        if(S.done.R6B) return;
        CELLS[i].r=(CELLS[i].r+1)%4; SND.relay(); render();
      });
    });
  }
  function warn(c,gh){ return c.node && !gh.ok }

  function finish(gh){
    const d=el("div","done-strip");
    d.innerHTML=`<div class="k">CHECKSUM</div><div><div class="v">回路接通，流量计打印校验码 <b>0719</b>。</div>
      <div class="k" style="margin-top:3px">流量校验码 = 0719</div></div>`;
    b.appendChild(d);
    sumBox.style.display="block";
    sumBox.innerHTML=`CHECKSUM 0719 · LOOP CLOSED · COOLANT 0.9 MPa`;
    const r2=el("div"); r2.style.cssText="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px";
    const go=el("button","btn go","最后：结项终端 ›"); go.addEventListener("click",()=>open(6));
    const tip=el("div","dim"); tip.style.cssText="flex-basis:100%;font-size:11px";
    tip.textContent="侧栏可以回看其它档案；结项单需要这串校验码。";
    r2.appendChild(go); r2.appendChild(tip); b.appendChild(r2);
    solve("R6B",{keys:{sum:"0719"},note:"冷却回路接通（06-B），流量计打印校验码 0719。"});
  }

  const row=el("div","row"); row.style.marginTop="10px";
  const reset=el("button","btn sm","复位歧管 ⟲");
  const hint=el("div","dim"); hint.style.flexBasis="100%"; hint.textContent="点任意一格顺时针转 90°；灰格焊死。";
  reset.addEventListener("click",()=>{ if(S.done.R6B) return; CELLS.forEach((c,i)=>{ c.r=INIT[i] }); SND.click(); render() });
  row.appendChild(reset); row.appendChild(hint);
  b.appendChild(row);
  if(S.done.R6B){
    reset.style.display="none";
    sumBox.style.display="block";
    sumBox.innerHTML=`CHECKSUM 0719 · LOOP CLOSED · COOLANT 0.9 MPa`;
    const d=el("div","done-strip");
    d.innerHTML=`<div class="k">CHECKSUM</div><div><div class="v">已归档：流量校验码 0719。</div></div>`;
    b.appendChild(d);
    const r2=el("div"); r2.style.cssText="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px";
    const go=el("button","btn go","最后：结项终端 ›"); go.addEventListener("click",()=>open(6));
    r2.appendChild(go); b.appendChild(r2);
  }
  render();
  p.appendChild(b); st.appendChild(p);
};

/* ================= 档案 07：结项终端 ================= */
M.R7=function(st){
  const p=el("div","panel");
  p.appendChild(shellHead("RECORD 07 · 结项终端","DECOMMISSION / 一次发送","再入窗口 04:11 / 发送机会仅一次 / 需五项一致 + 发射授权 + 回路校验"));

  const term=el("div","term");

  term.innerHTML=`<div class="k">DECOMMISSION PROTOCOL 7 · 长夜档案馆</div>

    SEALED ...... <span class="k">[ 封存年份 / 4 位 ]</span><br>

  b.appendChild(term);

  function field(label,ph,w,mx){
    const w2=el("div");

    l.textContent=label;
    const i=document.createElement("input"); i.type="text"; i.placeholder=ph; i.maxLength=mx; i.style.width="100%"; i.style.letterSpacing="4px";
    w2.appendChild(l); w2.appendChild(i); grid.appendChild(w2);
    return i;
  }
  const fBay=field("BAY / 机柜编号","──",null,3);
  const fYear=field("SEALED / 封存年份","────",null,5);
  const fCall=field("CALLSIGN / 旧呼号","----",null,6);
  const fAz=field("AZIMUTH / 归航方位","───",null,4);
  const fSum=field("CHECKSUM / 流量校验码","────",null,5);
  fSum.parentElement.style.gridColumn="1/-1";
  b.appendChild(grid);

  const row=el("div","row"); row.style.marginTop="14px";
  const send=el("button","btn go","① 预检");
  const msg=el("div","msg"); msg.style.flexBasis="100%";
  row.appendChild(send); row.appendChild(msg); b.appendChild(row);

  const detail=el("div"); detail.style.marginTop="8px";
  b.appendChild(detail);

  let checked=false;
  function vals(){ return [fBay.value.trim(),fYear.value.trim(),fCall.value.trim().toUpperCase(),fAz.value.trim(),fSum.value.trim()] }
  if(S.done.R7){
    [fBay,fYear,fCall,fAz,fSum].forEach((x,i)=>{ x.disabled=true; x.value=["07","1998","KITE","213","0719"][i] });
    send.disabled=true; msg.textContent="已归档：结项单 04:11 发出，不可重发。"; msg.className="msg s";
  }
  send.addEventListener("click",()=>{
    if(S.done.R7){ msg.textContent="这份档案已经归档，结项单不可重复发送。"; msg.className="msg"; return }
    const [a,b2,c,d,e]=vals();
    if(!S.done.R6){ msg.textContent="终端拒绝发送：发射授权未开（回档案 06 完成配线）。"; msg.className="msg e"; SND.err(); return }
    if(!S.done.R6B){ msg.textContent="终端拒绝发送：冷却回路还开着（回 06-B 接通两枚冷却节点，取校验码）。"; msg.className="msg e"; SND.err(); return }
    const bad=[];
    if(a!=="07") bad.push("BAY");
    if(b2!=="1998") bad.push("SEALED");
    if(c!=="KITE") bad.push("CALLSIGN");
    if(d!=="213") bad.push("AZIMUTH");
    if(e!=="0719") bad.push("CHECKSUM");
    if(bad.length){
      msg.textContent=`校验失败：${bad.join(" / ")} 与档案不符（共 ${bad.length} 项）。`; msg.className="msg e";

      detail.innerHTML=`<div style="font-size:12px;color:var(--tx3)">五项都能在终端日志里核对。缺哪一项，就回对应档案再看一眼。</div>`;

      yes.disabled=true; no.disabled=true; send.disabled=true;
      msg.textContent="发送中……链路正在把这一段四十一年的循环交出去。"; msg.className="msg";
      transmitFx("TRANSMITTING",()=>{
        solve("R7",{note:"结项单填写：BAY 07 / SEALED 1998 / CALLSIGN KITE / AZIMUTH 213 / CHECKSUM 0719。发送完成。"});
        M_end(st);
      });
    });
  });

  p.appendChild(b); st.appendChild(p);
};

    b.appendChild(bonus);

    const tip=el("div","msg"); tip.style.marginTop="14px";
    tip.textContent="档案柜里还有几处微光没有点亮：每份档案都藏着一盏灯，点亮它们会有另一段记录。";
    b.appendChild(tip);
  }

  const d=el("div","done-strip"); d.style.marginTop="16px";
  d.innerHTML=`<div class="k">END</div>
    <div><div class="v">《长夜档案馆 · 第七号机柜》— 结项完成</div>
    <div class="k" style="margin-top:3px">BAY 07 · 1998 · KITE · 213 · 0719${S.done["R3B"]?" · 黑匣子已抄录":""} · 灯 ${lampN}/7</div></div>`;
  b.appendChild(d);

  const row=el("div","row"); row.style.marginTop="18px";
  const again=el("button","btn sm","重新审计");
  again.addEventListener("click",()=>{
    try{localStorage.removeItem(SAVE); localStorage.removeItem("ln_intro")}catch(e){}
    S=blank(); renderRail(); S.cur=-3; renderNode(); M_cover(); toast("已重置，可重新开始");

  const back=el("button","btn sm","回看档案柜");
  back.addEventListener("click",()=>{ S.cur=6; save(); renderRail(); renderNode(); open(6) });
  row.appendChild(again); row.appendChild(back);

    <span class="dim">剧本 / 谜题 / 程序化插图 / 程序化音频 · 单文件离线可运行</span><br>
    <span class="dim">写给所有替别人留过一盏灯的人。</span>`;
  b.appendChild(cr);
  p.appendChild(b); st.appendChild(p);

  const foot=el("div"); foot.style.cssText="margin-top:14px;font-family:var(--mono);font-size:10px;color:var(--tx3);letter-spacing:1px;text-align:center";
  foot.textContent="LONG NIGHT ARCHIVE // UPTIME RESET // AUDITOR-1";
  st.appendChild(foot);
  SND.ok();
}

/* ================= 启动 ================= */
function boot(){
  renderRail();
  if(!S.seen){ S.cur=-3; renderNode(); M_cover(); }
  else if(S.cur===-3){ renderNode(); M_cover(); }
  else if(S.cur===-4 && GATE.R6B()){ open(-4); }
  else{ open(S.cur>=0?S.cur:(S.cur===-2?-2:0)); }
  const ab=$("btnAudio");
  if(ab){ ab.textContent=AU.on?"声 · 开":"声 · 关"; ab.classList.toggle("off",!AU.on);
    ab.addEventListener("click",()=>{ auWake(); auMute(!AU.on); }) }
  document.addEventListener("pointerdown",auWake,{once:true});
  $("btnLog").addEventListener("click",()=>{ renderLog(); $("drawer").classList.add("open"); $("mask").classList.add("open") });
  $("btnCloseLog").addEventListener("click",closeLog);
  $("mask").addEventListener("click",closeLog);
  $("bellClose").addEventListener("click",bellClose);
  $("bellMask").addEventListener("click",bellClose);
  $("btnRestart").addEventListener("click",()=>{
    if(!confirm("清空全部归档进度，重新开始本次审计？")) return;
    try{localStorage.removeItem(SAVE); localStorage.removeItem("ln_intro")}catch(e){}
    S=blank(); renderRail(); renderNode(); S.cur=-3; M_cover(); toast("已重置");
  });
  runIntro();
}
function closeLog(){ $("drawer").classList.remove("open"); $("mask").classList.remove("open") }
function renderLog(){
  const kk=$("logKeys"); kk.innerHTML="";
  const found=Object.keys(S.keys);
  if(!found.length) kk.innerHTML='<div class="litem">尚无已解析的密钥。归档档案后会写入此处。</div>';
  found.forEach(k=>{ const d=el("div","kitem");
    d.innerHTML=`<div class="kk">${KEYS[k].k}</div><div class="kv">${esc(S.keys[k])}</div><div class="kn">${KEYS[k].n}</div>`;
    kk.appendChild(d)});
  const nn=$("logNotes"); nn.innerHTML="";
  if(!S.notes.length) nn.innerHTML='<div class="litem">尚无记录。</div>';
  S.notes.forEach(t=>{ const d=el("div","litem"); d.innerHTML=t; nn.appendChild(d) });
  const eg=$("logEggs"); if(eg){ eg.innerHTML="";
    const ec=$("eggCount"); if(ec) ec.textContent=S.eggs.length+"/"+Object.keys(EGG_DEFS).length;
    if(!S.eggs.length) eg.innerHTML='<div class="litem">尚未发现彩蛋。它们藏在一些容易忽略的角落。</div>';
    S.eggs.forEach(id=>{ const d=el("div","egg-row");
      d.innerHTML=`<div class="ek">EGG · ${id.toUpperCase()}</div><div class="en">${EGG_DEFS[id].name} —— ${EGG_DEFS[id].n}</div>`;
      eg.appendChild(d) });
  }
}
boot();
